<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacktoberfest PR Tracker</title>
    <meta
      name="description"
      content="Track October pull requests for a GitHub username toward the classic 4-PR Hacktoberfest goal."
    />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hf-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>
    <header class="site-header">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="Hacktoberfest PR Tracker logo" />
        <div>
          <p class="eyebrow">October progress</p>
          <h1>Hacktoberfest PR Tracker</h1>
        </div>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to light mode">
        <span class="theme-icon theme-icon-moon" aria-hidden="true"></span>
        <span class="theme-icon theme-icon-sun" aria-hidden="true"></span>
        <span class="theme-label">Dark</span>
      </button>
    </header>

    <main>
      <section class="hero">
        <p class="lede">
          Look up any GitHub username and see pull requests created this October
          toward the classic <strong>4 PR</strong> goal.
        </p>
        <form id="tracker-form" class="tracker-form" autocomplete="off">
          <label for="username">GitHub username</label>
          <div class="input-row">
            <input
              id="username"
              name="username"
              type="text"
              inputmode="text"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="none"
              placeholder="octocat"
              required
            />
            <button type="submit" id="track-btn">Track</button>
          </div>
          <label class="check-row" for="exclude-own">
            <input id="exclude-own" type="checkbox" checked />
            <span>Only count PRs to other people's repos (Hacktoberfest rules)</span>
          </label>
        </form>
      </section>

      <section id="status" class="status" hidden></section>

      <section id="results" class="results" hidden>
        <div class="progress-card">
          <div class="progress-head">
            <h2>Progress</h2>
            <p id="progress-label" class="progress-label">0/4 PRs done</p>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="4"
            aria-valuenow="0"
            aria-labelledby="progress-label"
          >
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="complete-banner" class="complete-banner" hidden>
            Hacktoberfest complete!
          </p>
        </div>

        <div id="stats" class="stats">
          <div class="stat stat-merged">
            <span class="stat-num" id="stat-merged">0</span>
            <span class="stat-label">Merged</span>
          </div>
          <div class="stat stat-open">
            <span class="stat-num" id="stat-open">0</span>
            <span class="stat-label">Open</span>
          </div>
          <div class="stat stat-closed">
            <span class="stat-num" id="stat-closed">0</span>
            <span class="stat-label">Closed</span>
          </div>
        </div>

        <ul id="pr-list" class="pr-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      Built with Cursor for MLH Global Hack Week: Hacktoberfest
    </footer>

    <script src="script.js"></script>
  </body>
</html>
